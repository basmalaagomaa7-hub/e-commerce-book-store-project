<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookSpot</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        :root {
            --background-color: #F9EFE3;
            --text-color: #3B302B;
            --primary-color: #C98278;
            --cards: #FFFFFF;
            --offers: #D9B66F;
            --success: #82927D;
            --borders: #E7D8C8;
            --secondary-text: #766A63;
        }

        
        [data-theme = "dark"]{
            --background-color: #1E1917;
            --text-color: #F9EFE3;
            --primary-color: #C98278;
            --cards: #2A2421;
            --offers: #D9B66F;
            --success: #82927D;
            --borders: #453A35;
            --secondary-text: #B9AAA1;
        }



    #header {
        position: relative;
        display: flex;
        align-items: center;
        padding: 15px 30px;
       border-bottom: 3px solid var(--borders);
    }
    #logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 24px;
        margin: 0px;
    }
    #logo h4 {
        margin: 0px;
    }
    #search-bar {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
    }
    #Search {
        padding: 5px;
        border-radius: 10px;
        border: 2px solid var(--primary-color);
        background-color: var(--cards);
        color: var(--text-color);
    }

    #Basics {
        margin-left: auto;
    }

    #Basics p {
        margin: 0px;
    }
    #theme-toggle{
        background-color: transparent;
        border: none;
        padding: 0px;
        margin: 0px;
        cursor: pointer;
        color: var(--text-color);
        font: inherit;
        appearance: none;   
    }
    #theme-toggle span {
        pointer-events: none;
    }  
    #cart-icon{
        position: relative;
        display: inline-block;
    }
    #cart-count{
        position: absolute;
        top: -10px;
        right: -10px;
        background-color: var(--primary-color);
        color: white;
        border-radius: 50%;
        font-size: 10px;
        min-width: 15px;
        height: 15px;
        line-height: 15px;
        text-align: center;
    }


    </style>
    


    <style>
    #categories {
        border-right: 3px solid var(--borders);
    }

    #categories p {
        padding: 8px;
        margin: 5px 0;
        cursor: pointer;
        width: fit-content;
    }

    #categories p:hover {
        background-color: var(--primary-color);
        color: var(--cards);
        border-radius: 10px;
    }

    #main {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 30px;
        direction: ltr;
    }
    #books {
        min-width: 0;
    }
    #books h2 {
        text-align: center;
    }
    #book-list {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
    }
    .book {
        border: 3px solid var(--borders);
        background-color: var(--cards);
        padding: 10px;
        text-align: center;
    }
    .book img {
        width: 150px;
        height: 250px;
        object-fit: contain;
    }
    .button {
        background-color: var(--primary-color);
        color: var(--cards);
        border: none;
        padding: 5px 10px;
        cursor: pointer;
        border-radius: 10px;
    }
    </style>
</head>

<body  style="background-color: var(--background-color); color: var(--text-color);">
    <div id = "header">

    <div id="logo">
        <i class="fa-solid fa-book-open" style="color: #C98278;"></i>
        <h4>BookSpot</h4>
    </div>

    <div id="search-bar">
        <i class="fa-solid fa-magnifying-glass" style="color: #C98278;"></i>
        <input id="Search" type="text" placeholder="Search for books...">
    </div>

    <div id="Basics">
        <p>
            <i class="fa-solid fa-house" style="color: #C98278"></i>
            <a href="index.html" style="text-decoration: none; color: var(--text-color);">Home</a> |

            <i class="fa-brands fa-leanpub" style="color: #C98278"></i>
            <a href="books.html" style="text-decoration: none; color: var(--text-color);">Books</a> |

            <button id = "theme-toggle">
                <i class="fa-solid fa-moon" style="color: #c98278;"></i>
                <span>Dark Mode</span>
            </button> |

            <i class="fa-regular fa-circle-user" style="color: #c98278;"></i>
            <a href="sign-up.html" style="text-decoration: none; color: var(--text-color);">Sign Up</a> |

            <i class="fa-solid fa-right-to-bracket" style="color: #c98278;"></i>
            <a href="login.html" style="text-decoration: none; color: var(--text-color);">Login</a> |

            <span id="cart-icon">
                <i class="fa-solid fa-cart-shopping" style="color: #C98278;"></i>
                <span id="cart-count">0</span>
            </span>
            <a href="cart.html" style="text-decoration: none; color: var(--text-color);">Cart</a>

        </p>
    </div>

</div>

        
<div id="main">
    <div id="categories">
        <h4>Categories</h4>
        <p onclick="filterBooks('All Books')">All</p>
        <p onclick="filterBooks('Offers')">Offers</p>
        <p onclick="filterBooks('Business')">Business</p>
        <p onclick="filterBooks('Fantasy')">Fantasy</p>
        <p onclick="filterBooks('History')">History</p>
        <p onclick="filterBooks('Romance')">Romance</p>
    </div>

    <div id="books">
        <h2>Books</h2>

        <div id="book-list">


        </div>

    </div>
</div>

<script>
    const books = [];


    const searchInput = document.getElementById("Search");
    searchInput.addEventListener("input", function() {
        const searchTerm = searchInput.value.toLowerCase();
        const filteredBooks = books.filter(function(book) {
            return book.name.toLowerCase().includes(searchTerm);
        });
        displayBooks(filteredBooks);
    });

    function addBook(name, category1, category2, category3 , image, price, oldPrice = null, discount = null) {
        books.push({
            name: name,
            category1: category1,
            category2: category2,
            category3: category3,
            image: image,
            price: price,
            oldPrice: oldPrice,
            discount: discount
        });
    }

    addBook(
        "An American Beauty",
        "All Books",
        "Romance",
        "Offers",
        "assets/images/An American Beauty R offer.jpg",
        11,
        16.50,
        60
    );

    addBook(
        "ESG in the Age of AI",
        "All Books",
        "Business",
        "Offers",
        "assets/images/ESG in the Age of AI B offer.jpg",
        13.30,
        19,
        30
    );

    addBook(
        "A Touch of Darkness",
        "All Books",
        "Fantasy",
        "Offers",
        "assets/images/A Touch of Darkness F offer.jpg",
        14.40,
        18,
        20
    );

    addBook(
        "The Iliad",
        "All Books",
        "History",
        "Offers",
        "assets/images/The Iliad H offer.jpg",
        15,
        20,
        25
    );

    addBook(
        "How to Write a Love Story",
        "All Books",
        "Romance",
        "Offers",
        "assets/images/How to Write a Love Story R offer.jpg",
        10.20,
        17,
        40
);
    
    addBook(
        "Cancel Me If You Can",
        "All Books",
        "Business",
        null,
        "assets/images/Cancel Me If You Can B.jpg",
        10,
    );

    addBook(
        "Dopamine Detox",
        "All Books",
        "Business",
        null,
        "assets/images/Dopamine Detox B.jpg",
        12,
    );

    addBook(
        "Elon Musk: Tesla, SpaceX, and the Quest for a Fantastic Future",
        "All Books",
        "Business",
        null,
        "assets/images/Elon Musk B.jpg",
        15,
    );

    addBook(
        "Steve Jobs",
        "All Books",
        "Business",
        null,
        "assets/images/Steve Jobs B.jpg",
        15,
    );  

    addBook(
        "Brock Smith and the Dagger of Souls",
        "All Books",
        "Fantasy",
        null,
        "assets/images/Brock Smith and the Dagger of Souls F.jpg",   
        16.5,
    );

    addBook(
        "Harry Potter and the Philosopher's Stone", 
        "All Books",
        "Fantasy",
        null,
        "assets/images/Harry Potter and the Philosopher's Stone F.jpg",
        20,
    );

    addBook(
        "Reliquary",
        "All Books",
        "Fantasy", 
        null,
        "assets/images/Reliquary F.jpg",
        11,
    );

    addBook(
        "She Haunts Me Still",
        "All Books",
        "Fantasy",
        null,
        "assets/images/She Haunts Me Still F.jpg",
        9,
    );

    addBook(
        "1776",
        "All Books",
        "History", 
        null,
        "assets/images/1776 H.jpg",
        25,
    );

    addBook(
        "Empire of Ashes",
        "All Books",
        "History",
        null,
        "assets/images/Empire of Ashes H.jpg",
        19,
    );

    addBook(
        "Ortiz's War",
        "All Books",
        "History",
        null,
        "assets/images/Ortizs War H.jpg",
        22,
    );

    addBook(
        "It Ends With Us",
        "All Books",
        "Romance",
        null,
        "assets/images/It Ends with Us R.jpg",
        18,
    );  

    addBook(
        "It Starts With Us",
        "All Books",
        "Romance",  
        null,
        "assets/images/It Starts with Us R.jpg",
        20,
    );

    addBook(
        "The Hating Game",
        "All Books",
        "Romance",
        null,
        "assets/images/The Hating Game R.jpg",
        15, 
    );  

    addBook(
        "Yes, Chef",
        "All Books",
        "Romance",
        null,
        "assets/images/Yes, Chef R.jpg",
        16,
    );


    function displayBooks(bookArray) {
        const bookList = document.getElementById("book-list");

        bookList.innerHTML = "";

        bookArray.forEach(function(book) {
            let priceHTML = "";

            if (book.discount !== null) {
                priceHTML = `
                <del>$${book.oldPrice}</del>
                <strong style="color: #D9B66F;">-${book.discount}%</strong>
                <strong>$${book.price}</strong>
                `;
            

            } else {
                priceHTML = `<strong>$${book.price}</strong>`;
            }

            bookList.innerHTML += `
                <div class="book" >
                    <img src="${book.image}" alt="${book.name}">
                    <h3>${book.name}</h3>
                    <p>${priceHTML}</p>
                    <button onclick="addToCart(${books.indexOf(book)})" class="button">Add to Cart</button>
                </div>
            `;
        });


    }
    displayBooks(books);

    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    document.getElementById("cart-count").textContent = cart.reduce((total, item) => total + (item.quantity || 1), 0);

    function addToCart(index){

        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const book = books[index];
        const existingBook = cart.find(function(item) {
            return item.id === index;
        });

        if (existingBook) {
            existingBook.quantity += 1;
        } else {
            cart.push({
                id: index,
                name: book.name,
                price: book.price,
                image: book.image,
                quantity: 1
            });
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        document.getElementById("cart-count").textContent = cart.reduce((total, item) => total + (item.quantity || 1), 0);

    }




    function filterBooks(category) {
        const filteredBooks = books.filter(function(book) {
            return book.category1 === category || 
                   book.category2 === category || 
                   book.category3 === category;
        });
        displayBooks(filteredBooks);

    }

    const savedTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);

    const themeButton = document.getElementById("theme-toggle");

    if (themeButton) {
        updateThemeButton(savedTheme);

        themeButton.addEventListener("click", () => {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const newTheme = currentTheme === "dark" ? "light" : "dark";

            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
            updateThemeButton(newTheme);
        });
    }

    function updateThemeButton(theme) {
        if (themeButton) {
            themeButton.innerHTML = theme === "dark"
                ? '<i class="fa-solid fa-sun" style="color: #c98278;"></i> <span>Light Mode</span>'
                : '<i class="fa-solid fa-moon" style="color: #c98278;"></i> <span>Dark Mode</span>';
        }
    }


    
    
</script>

</body>
</html>
