<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/loginbookstore.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <title>BookStore | Sign Up</title>
</head>
<body>


<!-- Main card -->
<div class="card">

<div class="card-top">
    <a href="index.html" class="back-link"><i class="fa-solid fa-house"></i></a>
    <button id="theme-toggle" type="button">
        <i class="fa-solid fa-moon" style="color: #c98278;"></i>
        <span>Dark Mode</span>
    </button>
</div>

    <!-- Title -->
    <div class="title">
        <div class="brand-logo"><i class="fa-solid fa-book-open"></i></div>
        <h1>BookStore</h1>
        <p class="subtitle">Create Account</p>
    </div>

    <!-- Sign up form -->

    <form id="signup-form">
    <div class="field">
        <label for="email">Enter your email</label>
        <div class="input">
        <input
            type="email"
            id="email"
            name="email"
            placeholder="email"
            autocomplete="email"
        />
        </div>
        <span class="error-msg" id="email-error">Please enter your email.</span>
    </div>

    <div class="field">
        <label for="password">Password</label>
        <div class="input">
        <input
            name="password"
            type="password"
            id="password"
            placeholder="password"
            autocomplete="new-password"
        />
        </div>
        <span class="error-msg" id="password-error">Please enter your password.</span>
    </div>

    <div class="field">
        <label for="confirm-password">Confirm password</label>
        <div class="input">
        <input
            name="confirm-password"
            type="password"
            id="confirm-password"
            placeholder="confirm password"
            autocomplete="new-password"
        />
        </div>
        <span class="error-msg" id="confirm-password-error">Please confirm your password.</span>
    </div>

    <button type="submit" class="signin-btn">Sign Up</button>

    </form>


    <div class="separator"></div>

    <p class="bottom-text">
    Already Have an Account? <a href="login.html">Sign In</a>
    </p>

</div>



    <script src="js/signup.js"></script>
</body>
</html>
