<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/loginbookstore.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    
    
    <title>BookSpot | Login</title>
</head>
<body>


<!-- Main card -->
<div class="card">

<div class="card-top">
    <a href="index.html" class="back-link"><i class="fa-solid fa-house"></i></a>
    <button id="theme-toggle" type="button">
        <i class="fa-solid fa-moon" style="color: #c98278;"></i>
        <span>Dark Mode</span>
    </button>
</div>

    <!-- Title -->
    <div class="title">
        <div class="brand-logo"><i class="fa-solid fa-book-open"></i></div>
        <h1>BookSpot</h1>
        <p class="subtitle">Welcome Back</p>
    </div>

    <!-- Login form -->

    <form id="login-form">
    <div class="field">
        <label for="email">Enter your email</label>
        <div class="input">
        <input
            type="email"
            id="email"
            name="email"
            placeholder="email"
            autocomplete="email"
        />
        </div>
        <span class="error-msg" id="email-error">Please enter your email.</span>
    </div>

    <div class="field">
        <label for="password">Password</label>
        <div class="input">
        <input
            name="password"
            type="password"
            id="password"
            placeholder="password"
        />
        </div>
        <span class="error-msg" id="password-error">Please enter your password.</span>
    </div>

    <div class="extras">

        <label class="remember">
        <input type="checkbox" name="remember" />
        <span class="checkmark"></span>
        Remember me
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
    </div>


    <button type="submit" class="signin-btn">Sign In</button>

    </form>


    <div class="separator"></div>

    <p class="bottom-text">
    Doesn't Have an Account? <a href="sign-up.html">Sign Up</a>
    </p>

</div>



   
    <script src="js/login.js"></script>
</body>
</html>
